<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>信用卡經辦 AI Agent</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
</head>
<body class="bg-slate-100 text-slate-800 h-screen flex flex-col overflow-hidden">
<header class="bg-slate-900 text-white shrink-0">
    <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
        <div>
            <h1 class="text-xl font-semibold">信用卡經辦 AI Agent</h1>
            <p class="text-sm text-slate-300">新戶核卡初審 · 異常刷卡通報封鎖</p>
        </div>
        <a href="supervisor.html" class="rounded-md bg-amber-500 px-4 py-2 text-sm font-medium text-slate-900 hover:bg-amber-400">主管放行畫面</a>
    </div>
</header>

<main class="flex-1 min-h-0 w-full max-w-4xl mx-auto px-4 py-4">
    <section class="h-full flex flex-col rounded-lg bg-white shadow-sm">
        <div class="shrink-0 flex items-center justify-between border-b border-slate-200 px-5 py-3">
            <h2 class="font-semibold">AI 處理紀錄</h2>
            <div class="flex items-center gap-3">
                <span id="loadingIndicator" class="hidden text-sm text-blue-600 animate-pulse">AI 處理中…</span>
                <button id="newConversationButton" class="rounded-md border border-slate-300 px-3 py-1 text-sm hover:bg-slate-50 disabled:opacity-50">開始新對話</button>
            </div>
        </div>

        <div id="conversationLog" class="flex-1 min-h-0 overflow-y-auto space-y-4 px-5 py-4">
            <p id="emptyState" class="text-sm text-slate-400">點「待審案件」或「警示卡片」挑選案件，或輸入 / 使用指令。同一段對話中可以直接追問。</p>
        </div>

        <div class="shrink-0 border-t border-slate-200 px-5 py-3">
            <div class="mb-2 flex flex-wrap items-center gap-2">
                <button id="pendingApplicationsButton" class="rounded-full bg-blue-600 px-3 py-1 text-xs font-medium text-white hover:bg-blue-500 disabled:opacity-50">待審案件</button>
                <button id="alertCardsButton" class="rounded-full bg-blue-600 px-3 py-1 text-xs font-medium text-white hover:bg-blue-500 disabled:opacity-50">警示卡片</button>
                <span class="text-xs text-slate-500">輸入 / 叫出指令選單，↑ ↓ 選擇、Enter 確認、Esc 關閉；Shift+Enter 換行</span>
            </div>
            <div class="relative flex items-end gap-2">
                <textarea id="messageInput" rows="2" class="flex-1 resize-none rounded-md border border-slate-300 p-2 text-sm" placeholder="輸入 / 使用指令，或直接提問"></textarea>
                <button id="sendMessageButton" class="shrink-0 rounded-md bg-slate-700 px-5 py-2 text-sm font-medium text-white hover:bg-slate-600 disabled:opacity-50">送出</button>
                <div id="suggestionPanel" class="hidden absolute left-0 right-0 bottom-full z-10 mb-2 max-h-72 overflow-y-auto rounded-md border border-slate-300 bg-white shadow-lg"></div>
            </div>
        </div>
    </section>
</main>

<script>
    const MCP_SERVER_URL = 'http://localhost:8081';
    const URGENT_WARNING_PREFIX = '【緊急警告】';
    const EMPTY_STATE_TEXT = '點「待審案件」或「警示卡片」挑選案件，或輸入 / 使用指令。同一段對話中可以直接追問。';
    const SEARCH_DELAY_MILLISECONDS = 250;
    const NO_ACTIVE_SUGGESTION = -1;
    const IME_PROCESSING_KEY_CODE = 229;
    const SKILL_MENU_PATTERN = /^[\/／]([^\s　]*)$/;
    const SKILL_ARGUMENT_PATTERN = /^[\/／]([^\s　]+)[\s　]+(.*)$/;
    const APPLICATIONS_SOURCE = '/api/clerk/applications';
    const SEARCH_PATHS = {
        customerId: '/api/clerk/applicants/search',
        cardNumber: '/api/clerk/cards/search'
    };
    const STATUS_BADGE_CLASSES = {
        APPROVED: 'bg-green-100 text-green-800',
        PENDING_REVIEW: 'bg-amber-100 text-amber-800',
        SUPERVISOR_REJECTED: 'bg-red-100 text-red-800',
        FROZEN: 'bg-red-100 text-red-800',
        ESCALATED: 'bg-red-100 text-red-800'
    };
    const DEFAULT_BADGE_CLASS = 'bg-slate-100 text-slate-700';

    const messageInput = document.getElementById('messageInput');
    const suggestionPanel = document.getElementById('suggestionPanel');
    const actionButtons = ['pendingApplicationsButton', 'alertCardsButton', 'sendMessageButton', 'newConversationButton']
        .map(id => document.getElementById(id));
    let conversationId = crypto.randomUUID();
    let skills = [];
    let suggestions = [];
    let activeSuggestionIndex = NO_ACTIVE_SUGGESTION;
    let isBusy = false;
    let activeCaseList = null;
    let searchTimer = null;
    let searchSequence = 0;

    function startNewConversation() {
        conversationId = crypto.randomUUID();
        const emptyState = document.createElement('p');
        emptyState.id = 'emptyState';
        emptyState.className = 'text-sm text-slate-400';
        emptyState.textContent = EMPTY_STATE_TEXT;
        document.getElementById('conversationLog').replaceChildren(emptyState);
    }

    function setBusy(busy) {
        isBusy = busy;
        actionButtons.forEach(button => button.disabled = busy);
        document.getElementById('loadingIndicator').classList.toggle('hidden', !busy);
    }

    function appendElement(element) {
        document.getElementById('emptyState')?.remove();
        const log = document.getElementById('conversationLog');
        log.appendChild(element);
        log.scrollTop = log.scrollHeight;
        return element;
    }

    function appendEntry(className, text) {
        const entry = document.createElement('div');
        entry.className = className;
        entry.textContent = text;
        return appendElement(entry);
    }

    function appendError(text) {
        appendEntry('rounded-lg bg-red-100 text-red-800 px-4 py-3 text-sm', text);
    }

    function appendClerkMessage(message) {
        appendEntry('ml-auto max-w-[85%] rounded-lg bg-blue-50 border border-blue-200 px-4 py-3 text-sm', '經辦：' + message);
    }

    function appendAgentReply(reply) {
        if (reply.startsWith(URGENT_WARNING_PREFIX)) {
            const wrapper = document.createElement('div');
            wrapper.className = 'rounded-lg border-2 border-red-600 overflow-hidden';
            const banner = document.createElement('div');
            banner.className = 'bg-red-600 text-white font-bold px-4 py-2';
            banner.textContent = '緊急警告：超高金額交易已升級資深風控主管，AI 未執行鎖卡';
            const body = document.createElement('div');
            body.className = 'whitespace-pre-wrap px-4 py-3 text-sm bg-red-50';
            body.textContent = reply;
            wrapper.append(banner, body);
            appendElement(wrapper);
            return;
        }
        appendEntry('max-w-[85%] whitespace-pre-wrap rounded-lg bg-slate-50 border border-slate-200 px-4 py-3 text-sm', reply);
    }

    async function sendToAgent(message) {
        if (isBusy) {
            return;
        }
        appendClerkMessage(message);
        setBusy(true);
        try {
            const response = await fetch('/api/agent/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({conversationId, message})
            });
            if (!response.ok) {
                throw new Error('HTTP ' + response.status);
            }
            const {reply} = await response.json();
            appendAgentReply(reply);
        } catch (error) {
            appendError('呼叫 AI Agent 失敗：' + error.message);
        } finally {
            setBusy(false);
        }
    }

    async function fetchJson(url) {
        const response = await fetch(url);
        if (!response.ok) {
            throw new Error('HTTP ' + response.status);
        }
        return response.json();
    }

    async function loadSkills() {
        try {
            skills = await fetchJson('/api/agent/skills');
        } catch (error) {
            appendError('無法取得指令清單：' + error.message);
        }
    }

    function findSkillByName(name) {
        return skills.find(skill => skill.name === name);
    }

    function findAgentSkillByArgument(argument) {
        return skills.find(skill => skill.kind === 'AGENT' && skill.argument === argument);
    }

    function createStatusBadge(status, label) {
        const badge = document.createElement('span');
        badge.className = 'shrink-0 rounded-full px-2 py-0.5 text-xs ' + (STATUS_BADGE_CLASSES[status] ?? DEFAULT_BADGE_CLASS);
        badge.textContent = label;
        return badge;
    }

    function createCaseRow(item, isApplication, listState) {
        const targetSkill = findAgentSkillByArgument(isApplication ? 'customerId' : 'cardNumber');
        const row = document.createElement(item.actionable ? 'button' : 'div');
        row.className = 'flex w-full items-center justify-between gap-3 px-4 py-2 text-left text-sm '
            + (item.actionable ? 'hover:bg-blue-50' : 'text-slate-400');
        const description = document.createElement('span');
        description.textContent = isApplication
            ? `${item.fullName}　${item.customerId}`
            : `${item.holderName}　末四碼 ${item.last4}　${item.verdictLabel}`;
        row.append(description, createStatusBadge(item.status, item.statusLabel));
        if (item.actionable && targetSkill) {
            const target = isApplication ? item.customerId : item.cardNumber;
            row.addEventListener('click', () => {
                if (isBusy || !listState.isActive || row.dataset.isSent) {
                    return;
                }
                row.dataset.isSent = 'true';
                row.disabled = true;
                row.classList.add('opacity-50');
                sendToAgent(`/${targetSkill.name} ${target}`);
            });
        }
        return row;
    }

    async function showCaseList(skill) {
        appendClerkMessage('/' + skill.name);
        try {
            const items = await fetchJson(MCP_SERVER_URL + skill.source);
            const isApplication = skill.source === APPLICATIONS_SOURCE;
            const container = document.createElement('div');
            container.className = 'max-w-[85%] rounded-lg bg-slate-50 border border-slate-200 overflow-hidden';
            const title = document.createElement('div');
            title.className = 'px-4 py-2 text-sm font-semibold border-b border-slate-200';
            title.textContent = `${skill.name}（${items.length} 筆）`;
            const listState = {isActive: true, container};
            container.append(title, ...items.map(item => createCaseRow(item, isApplication, listState)));
            deactivatePreviousCaseList(listState);
            appendElement(container);
        } catch (error) {
            appendError('無法取得清單：' + error.message);
        }
    }

    function deactivatePreviousCaseList(currentList) {
        if (activeCaseList) {
            activeCaseList.isActive = false;
            activeCaseList.container.classList.add('opacity-50');
        }
        activeCaseList = currentList;
    }

    function showCaseListByName(name) {
        const skill = findSkillByName(name);
        if (skill) {
            showCaseList(skill);
        } else {
            appendError('無法取得清單：指令清單尚未載入');
        }
    }

    function cancelPendingSearch() {
        clearTimeout(searchTimer);
        searchSequence++;
    }

    function hideSuggestions() {
        suggestions = [];
        suggestionPanel.classList.add('hidden');
        suggestionPanel.replaceChildren();
    }

    function renderSuggestions(items, initialIndex = 0) {
        suggestions = items;
        activeSuggestionIndex = initialIndex;
        if (items.length === 0) {
            hideSuggestions();
            return;
        }
        suggestionPanel.replaceChildren(...items.map((item, index) => {
            const option = document.createElement('div');
            option.className = 'flex cursor-pointer items-center justify-between gap-3 px-3 py-2 text-sm'
                + (index === activeSuggestionIndex ? ' bg-blue-50' : '')
                + (item.isSelectable === false ? ' text-slate-400 cursor-not-allowed' : '');
            const label = document.createElement('span');
            label.className = 'font-medium';
            label.textContent = item.label;
            const detail = document.createElement('span');
            detail.className = 'text-xs text-slate-500';
            detail.textContent = item.detail;
            option.append(label, detail);
            option.addEventListener('mousedown', event => {
                event.preventDefault();
                selectSuggestion(index);
            });
            return option;
        }));
        suggestionPanel.classList.remove('hidden');
    }

    function moveActiveSuggestion(offset) {
        activeSuggestionIndex = activeSuggestionIndex === NO_ACTIVE_SUGGESTION
            ? (offset > 0 ? 0 : suggestions.length - 1)
            : (activeSuggestionIndex + offset + suggestions.length) % suggestions.length;
        [...suggestionPanel.children].forEach((option, index) =>
            option.classList.toggle('bg-blue-50', index === activeSuggestionIndex));
        suggestionPanel.children[activeSuggestionIndex].scrollIntoView({block: 'nearest'});
    }

    function selectSuggestion(index) {
        const selected = suggestions[index];
        if (!selected || selected.isSelectable === false) {
            return;
        }
        hideSuggestions();
        selected.onSelect();
    }

    function suggestSkills(prefix) {
        renderSuggestions(skills
            .filter(skill => skill.name.startsWith(prefix))
            .map(skill => ({
                label: '/' + skill.name,
                detail: skill.description,
                onSelect: () => chooseSkill(skill)
            })));
    }

    function chooseSkill(skill) {
        if (skill.kind === 'LIST') {
            messageInput.value = '';
            showCaseList(skill);
            return;
        }
        messageInput.value = `/${skill.name} `;
        messageInput.focus();
    }

    function toCandidate(skill, item) {
        const isApplicant = skill.argument === 'customerId';
        const target = isApplicant ? item.customerId : item.cardNumber;
        return {
            label: isApplicant ? `${item.fullName}　${item.customerId}` : `${item.holderName}　末四碼 ${item.last4}`,
            detail: isApplicant ? item.statusLabel : `${item.verdictLabel}　${item.statusLabel}`,
            isSelectable: item.actionable,
            onSelect: () => {
                messageInput.value = '';
                sendToAgent(`/${skill.name} ${target}`);
            }
        };
    }

    function scheduleCandidateSearch(skill, keyword) {
        cancelPendingSearch();
        hideSuggestions();
        if (!keyword) {
            return;
        }
        const sequence = ++searchSequence;
        searchTimer = setTimeout(async () => {
            try {
                const items = await fetchJson(
                    `${MCP_SERVER_URL}${SEARCH_PATHS[skill.argument]}?q=${encodeURIComponent(keyword)}`);
                if (sequence === searchSequence) {
                    renderSuggestions(items.map(item => toCandidate(skill, item)), NO_ACTIVE_SUGGESTION);
                }
            } catch (error) {
                hideSuggestions();
            }
        }, SEARCH_DELAY_MILLISECONDS);
    }

    function updateSuggestions() {
        const text = messageInput.value.trimStart();
        const menuMatch = text.match(SKILL_MENU_PATTERN);
        if (menuMatch) {
            cancelPendingSearch();
            suggestSkills(menuMatch[1]);
            return;
        }
        const argumentMatch = text.match(SKILL_ARGUMENT_PATTERN);
        const skill = argumentMatch && findSkillByName(argumentMatch[1]);
        if (skill && SEARCH_PATHS[skill.argument]) {
            scheduleCandidateSearch(skill, argumentMatch[2].trim());
            return;
        }
        cancelPendingSearch();
        hideSuggestions();
    }

    function sendTypedMessage() {
        const message = messageInput.value.trim();
        if (message && !isBusy) {
            cancelPendingSearch();
            hideSuggestions();
            sendToAgent(message);
            messageInput.value = '';
        }
    }

    function handleInputKeydown(event) {
        if (event.isComposing || event.keyCode === IME_PROCESSING_KEY_CODE) {
            return;
        }
        const isSuggestionOpen = suggestions.length > 0;
        if (isSuggestionOpen && (event.key === 'ArrowDown' || event.key === 'ArrowUp')) {
            event.preventDefault();
            moveActiveSuggestion(event.key === 'ArrowDown' ? 1 : -1);
        } else if (isSuggestionOpen && event.key === 'Enter' && activeSuggestionIndex !== NO_ACTIVE_SUGGESTION) {
            event.preventDefault();
            selectSuggestion(activeSuggestionIndex);
        } else if (isSuggestionOpen && event.key === 'Escape') {
            hideSuggestions();
        } else if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            sendTypedMessage();
        }
    }

    messageInput.addEventListener('input', updateSuggestions);
    messageInput.addEventListener('keydown', handleInputKeydown);
    messageInput.addEventListener('blur', () => {
        cancelPendingSearch();
        hideSuggestions();
    });
    document.getElementById('sendMessageButton').addEventListener('click', sendTypedMessage);
    document.getElementById('pendingApplicationsButton').addEventListener('click', () => showCaseListByName('待審案件'));
    document.getElementById('alertCardsButton').addEventListener('click', () => showCaseListByName('警示卡片'));
    document.getElementById('newConversationButton').addEventListener('click', startNewConversation);

    loadSkills();
</script>
</body>
</html>
